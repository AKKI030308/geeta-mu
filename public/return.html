<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verifying Payment</title><style>body{background:#000;color:#fff;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.c{text-align:center;padding:30px}.s{margin:auto;width:32px;height:32px;border:3px solid #333;border-top-color:#ffa31a;border-radius:50%;animation:x 1s linear infinite}@keyframes x{to{transform:rotate(360deg)}}.e{color:#f66}</style><div class=c><div id=s class=s></div><h2 id=t>Verifying payment…</h2><p id=m>Please wait.</p></div><script>(async()=>{const i=new URLSearchParams(location.search).get('order_id'),t=document.getElementById('t'),m=document.getElementById('m'),s=document.getElementById('s');if(!i){s.style.display='none';t.textContent='Payment status unavailable';return}try{const r=await fetch('/api/verify-payment?order_id='+encodeURIComponent(i)),d=await r.json();if(r.ok&&d.status==='PAID'){t.textContent='Payment successful';m.textContent='Opening your access…';location.replace('/api/telegram-redirect?order_id='+encodeURIComponent(i));return}s.style.display='none';t.textContent=d.status==='PENDING'?'Payment pending':'Payment failed';t.className=d.status==='PENDING'?'':'e';m.textContent=d.status==='PENDING'?'Refresh after a moment.':'Telegram access was not granted.'}catch(e){s.style.display='none';t.textContent='Verification error';t.className='e'}})()</script>
