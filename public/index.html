<script>

    // --- 1. SMOOTH DYNAMIC TEXT ANIMATION ---

    (function() {

        const el1 = document.getElementById('text-1');
        const el2 = document.getElementById('text-2');

        let showingFirst = true;

        setInterval(() => {

            if (showingFirst) {

                el1.classList.remove('slide-in');
                el1.classList.add('slide-out');

                setTimeout(() => {
                    el2.classList.remove('slide-hidden');
                    el2.classList.add('slide-in');
                }, 50);

                setTimeout(() => {
                    el1.classList.remove('slide-out');
                    el1.classList.add('slide-hidden');
                }, 500);

            } else {

                el2.classList.remove('slide-in');
                el2.classList.add('slide-out');

                setTimeout(() => {
                    el1.classList.remove('slide-hidden');
                    el1.classList.add('slide-in');
                }, 50);

                setTimeout(() => {
                    el2.classList.remove('slide-out');
                    el2.classList.add('slide-hidden');
                }, 500);

            }

            showingFirst = !showingFirst;

        }, 3000);

    })();


    // --- 2. PERSISTENT TIMER SCRIPT ---

    (function() {

        const KEY = 'stitch_offer_expires_v3';

        const MIN_MS = 30 * 60 * 1000;
        const MAX_MS = 90 * 60 * 1000;

        const LAST_RESET_MS = 10 * 1000;

        function randomDuration() {
            return Math.floor(
                Math.random() * (MAX_MS - MIN_MS + 1)
            ) + MIN_MS;
        }

        function setNewExpiry() {

            const e = Date.now() + randomDuration();

            try {
                sessionStorage.setItem(KEY, String(e));
            } catch {}

            return e;
        }

        function getExpiry() {

            try {

                const v = sessionStorage.getItem(KEY);

                if (v && Number(v) > Date.now()) {
                    return Number(v);
                }

            } catch {}

            return setNewExpiry();
        }

        let expiresAt = getExpiry();

        const elH = document.getElementById('cd-hours');
        const elM = document.getElementById('cd-mins');
        const elS = document.getElementById('cd-secs');

        function updateDisplay(ms) {

            const total = Math.max(
                0,
                Math.floor(ms / 1000)
            );

            if (elH) {
                elH.textContent =
                    String(Math.floor(total / 3600)).padStart(2, '0');
            }

            if (elM) {
                elM.textContent =
                    String(Math.floor((total % 3600) / 60)).padStart(2, '0');
            }

            if (elS) {
                elS.textContent =
                    String(total % 60).padStart(2, '0');
            }

        }

        function tick() {

            let rem = expiresAt - Date.now();

            if (rem <= LAST_RESET_MS) {

                expiresAt = setNewExpiry();

                rem = expiresAt - Date.now();

            }

            updateDisplay(rem);

        }

        tick();

        const iv = setInterval(tick, 1000);

        window.addEventListener(
            'beforeunload',
            () => clearInterval(iv)
        );

    })();


    // --- 3. VIDEO SCROLLER ---

    const videos = [

        {
            url: 'https://bvpm7vbw3r7w7mcj.public.blob.vercel-storage.com/vi/b2.mp4',
            title: 'Full Video in Group',
            time: '39 min',
            isVideo: true
        },

        {
            url: 'https://bvpm7vbw3r7w7mcj.public.blob.vercel-storage.com/vi/b1.mp4',
            title: 'Full Video in Group',
            time: '47 min',
            isVideo: true
        },

        {
            locked: true,
            title: 'Join Private Group',
            subtitle: 'To Watch All'
        },

        {
            locked: true,
            title: 'Unlock Content',
            subtitle: '200+ Photos/Videos'
        }

    ];

    const scroller =
        document.getElementById('videoScroller');


    videos.forEach((vid) => {

        const card = document.createElement('div');

        card.className =
            `relative flex-shrink-0 w-[38%] aspect-[9/16] rounded-xl overflow-hidden glass-panel snap-center border border-white/10 group shadow-lg`;

        if (vid.locked) {

            card.innerHTML = `

                <div class="absolute inset-0 bg-gray-800">

                    <img
                        src="https://ayeshaa.in/pvt/blurred.jpg"
                        class="w-full h-full object-cover opacity-50 filter blur-lg scale-110"
                    >

                </div>

                <div class="absolute inset-0 bg-black/40 flex flex-col items-center justify-center text-center p-2 backdrop-blur-[1px]">

                    <div class="w-10 h-10 rounded-full bg-white/10 backdrop-blur-md border border-white/20 flex items-center justify-center mb-2">

                        <i class="fas fa-lock text-white text-sm"></i>

                    </div>

                    <p class="text-[10px] font-bold text-white leading-tight">
                        ${vid.title}
                    </p>

                    <p class="text-[8px] text-premium-gold mt-0.5 font-bold uppercase tracking-wide">
                        ${vid.subtitle}
                    </p>

                </div>

            `;

        } else {

            card.innerHTML = `

                <video
                    src="${vid.url}#t=0.1"
                    preload="metadata"
                    class="w-full h-full object-cover transform group-hover:scale-105 transition duration-700"
                    muted
                    playsinline
                    loop
                ></video>

                <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-transparent to-transparent"></div>

                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-white/20 backdrop-blur-sm flex items-center justify-center opacity-0 group-hover:opacity-100 transition">

                    <i class="fas fa-play text-white text-xs ml-0.5"></i>

                </div>

                <div class="absolute bottom-2 left-2 right-2">

                    <p class="text-[10px] font-bold text-white truncate">
                        ${vid.title}
                    </p>

                    <p class="text-[9px] text-gray-400 flex items-center gap-1">

                        <i class="fas fa-clock text-[8px]"></i>

                        ${vid.time}

                    </p>

                </div>

                <div class="absolute top-2 right-2 bg-black/60 px-1.5 py-0.5 rounded text-[8px] font-bold text-white border border-white/10">
                    HD
                </div>

            `;

            const video =
                card.querySelector('video');

            card.addEventListener('click', () => {

                if (video.paused) {

                    document
                        .querySelectorAll('video')
                        .forEach(v => {

                            v.pause();
                            v.muted = true;

                            const p =
                                v.parentElement.querySelector('.fa-play')?.parentElement;

                            if (p) {
                                p.classList.remove('opacity-0');
                            }

                        });

                    video.muted = false;
                    video.play();

                    card
                        .querySelector('.fa-play')
                        .parentElement
                        .classList
                        .add('opacity-0');

                } else {

                    video.pause();

                    card
                        .querySelector('.fa-play')
                        .parentElement
                        .classList
                        .remove('opacity-0');

                }

            });

        }

        scroller.appendChild(card);

    });


    // --- 4. PRICE COUNTDOWN ANIMATION ---

    (function() {

        var start = 899;
        var end = 199;
        var duration = 2000;

        var priceEl =
            document.getElementById('priceCurrent');

        if (!priceEl) return;

        var startTime = null;

        function easeOutQuad(t) {
            return t * (2 - t);
        }

        function tick(ts) {

            if (!startTime) {
                startTime = ts;
            }

            var p =
                Math.min(
                    (ts - startTime) / duration,
                    1
                );

            var current =
                Math.round(
                    start +
                    (end - start) *
                    easeOutQuad(p)
                );

            if (current < end) {
                current = end;
            }

            priceEl.textContent = current;

            if (p < 1) {
                requestAnimationFrame(tick);
            } else {
                priceEl.textContent = end;
            }

        }

        requestAnimationFrame(tick);

    })();


    // --- 5. CASHFREE PAYMENT CTA ---
    // MOBILE NUMBER PROMPT REMOVED

    document
        .getElementById('payBtn')
        .addEventListener('click', async function(e) {

            e.preventDefault();

            const btn =
                this.querySelector('button');

            const original =
                btn.innerHTML;

            btn.disabled = true;

            btn.innerHTML = `
                <div class="flex flex-col items-center justify-center leading-tight">

                    <span class="text-white/90 text-[10px] font-medium tracking-wide uppercase mb-0.5">
                        Secure Checkout
                    </span>

                    <div class="flex items-center gap-1.5">

                        <i class="fas fa-lock text-white text-sm"></i>

                        <span class="text-white font-bold text-sm tracking-wide">
                            Opening Payment…
                        </span>

                    </div>

                </div>
            `;

            try {

                const r =
                    await fetch(
                        '/api/create-order',
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            body: JSON.stringify({})
                        }
                    );

                const data =
                    await r.json().catch(() => ({}));

                if (
                    !r.ok ||
                    !data.payment_session_id
                ) {

                    throw new Error(
                        data.error ||
                        'Unable to start payment.'
                    );

                }

                if (!window.Cashfree) {

                    throw new Error(
                        'Cashfree checkout could not load.'
                    );

                }

                const cashfree =
                    Cashfree({
                        mode:
                            data.mode ||
                            'sandbox'
                    });

                await cashfree.checkout({

                    paymentSessionId:
                        data.payment_session_id,

                    redirectTarget:
                        '_self'

                });

            } catch(err) {

                console.error(err);

                alert(
                    err.message ||
                    'Payment could not be started.'
                );

                btn.disabled = false;

                btn.innerHTML =
                    original;

            }

        });

</script>
